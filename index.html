<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Harmesh Weighment Calculator</title>

<meta name="theme-color" content="#1565C0">

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="loadingScreen" class="screen">

<div class="card">

<h2>Loading...</h2>

<p>Please wait</p>

</div>

</div>



<div id="loginScreen" class="screen hide">

<div class="card">

<h1>⚖️</h1>

<h2>Weighment Calculator</h2>

<p class="sub">

Secure Email Verification

</p>


<input
type="email"
id="email"
placeholder="Enter your Email">


<button id="sendLinkBtn">

Send Verification Link

</button>


<p id="loginMessage"></p>

</div>

</div>





<div id="calculatorScreen" class="screen hide">

<div class="card">

<h2>

Weighment Calculator

</h2>



<div class="row">

<select id="sku1">

<option value="50.120">

50.120 KG

</option>

<option value="25.120">

25.120 KG

</option>

</select>


<input
type="number"
id="bags1"
placeholder="Bags">

</div>





<div class="row">

<select id="sku2">

<option value="50.120">

50.120 KG

</option>

<option value="25.120">

25.120 KG

</option>

</select>


<input
type="number"
id="bags2"
placeholder="Bags">

</div>





<div class="result">

<h3>Total Weight</h3>

<div id="totalWeight">

0.000 KG

</div>

</div>





<div class="bags">

Total Bags :

<span id="totalBags">

0

</span>

</div>




<button id="resetBtn">

RESET

</button>



</div>

</div>




<footer>

© 2026 Harmesh Kumar

<br>

All Rights Reserved

</footer>




<script type="module" src="firebase.js"></script>

<script type="module" src="app.js"></script>

</body>

</html>
